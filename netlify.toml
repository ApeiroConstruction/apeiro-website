# Netlify build settings. Netlify detects Next.js and adds its adapter automatically,
# so redirects, image optimization and the quote form's server route all work as-is.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Only the live production site may be indexed by Google.
# LIVE since November 24, 2026. (Before launch this was "prelaunch": noindex + review password.)
# Deploy previews and branch deploys are always "preview" (noindex).
[context.production.environment]
  NEXT_PUBLIC_SITE_ENV = "production"

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"
